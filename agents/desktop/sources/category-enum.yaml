    kind: 实物
    aliases: ["手机", "智能手机"]
  平板:
    display: "平板"
    kind: 实物
    aliases: ["平板", "平板电脑", "平板pad", "pad"]
  手表:
    display: "智能手表手环"
    kind: 实物
    aliases: ["手表", "手环", "智能手表", "智能手环", "智能手表手环"]
  眼镜:
    display: "智能眼镜"
    kind: 实物
    aliases: ["眼镜", "智能眼镜"]
  # ---- 以下 17 个国补里没有, 只出现在本体文档与地方消费券 ----
  家电:
    display: "家电"
    kind: 实物
    aliases: ["家电", "家用电器", "大家电", "以旧换新家电"]
