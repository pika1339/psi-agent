  空调:
    display: "空调"
    kind: 实物
    aliases: ["空调", "空调机", "柜机", "挂机"]
  冰箱:
    display: "冰箱"
    kind: 实物
    aliases: ["冰箱", "电冰箱"]
  洗衣机:
    display: "洗衣机"
    kind: 实物
    aliases: ["洗衣机", "滚筒洗衣机"]
  电视:
    display: "电视"
    kind: 实物
    aliases: ["电视", "电视机", "智能电视"]
  热水器:
