# --------------------------------------------------------------------------- #
# 场景子集: 每个场景从总枚举里挑自己认的那些
# --------------------------------------------------------------------------- #
#
# **档位归属 (家电/数码) 只在这里**, 不在总枚举里。总枚举不知道「电脑算什么档」——
# 那是政策参数, 住在资料卡的 tiers。这里只记「在这个场景里它属于哪一档」。
scenarios:
  guobu:
    name: "国补"
    description: "2026 以旧换新 (家电 6 类) + 数码智能产品购新 (数码 4 类)"
    # 参数的唯一数据源。本子集的 id 与档位必须与那张卡逐条一致, 由判据钉死。
    source: "fact-cards/guobu-2026.yaml"
    categories:
      空调: {tier: "家电"}
      冰箱: {tier: "家电"}
      洗衣机: {tier: "家电"}
      电视: {tier: "家电"}
      热水器: {tier: "家电"}
      电脑: {tier: "家电"}
      手机: {tier: "数码"}
      平板: {tier: "数码"}
      手表: {tier: "数码"}
      眼镜: {tier: "数码"}

  local_voucher:
    name: "地方消费券"
    description: "A2 —— 按城市/区发放的消费券 (与国补不是一套品类)"
    measured_at: "2026-09-17"
    derived_from: "本地宝合肥消费券专题页 48 条线索的品类分布, 加上本轮实测见过的其余品类"
    # 类别分布是**实测数出来的**, 不是设计的。保留原始计数是为了让后来的人看得出
    # 「哪些是主品类、哪些只见到一次」—— 只留一个名单会把这两种情况抹平。
    observed_counts:
      汽车: 16
      餐饮: 12
      加油: 6
      文旅: 3
      电影: 3
      百货: 3
      家电: 1
    # 同一轮里在别处 (官方列表 / 检索 / 其他城市专题页) 见到、但不在合肥那 48 条里的。
    # 它们进子集, 只是没有计数 —— 计数与「见过」是两件事, 不编一个数出来。
    seen_elsewhere:
      - 商超
      - 住宿
      - 体育
      - 图书
      - 医药
      - 养老
      - 托育
      - 家政
    # 子集 = observed_counts 的键 + seen_elsewhere, 由判据钉死 (不是各写一份)。
    categories:
      汽车: {}
      餐饮: {}
      加油: {}
      文旅: {}
      电影: {}
      百货: {}
      家电: {}
      商超: {}
      住宿: {}
      体育: {}
      图书: {}
      医药: {}
      养老: {}
      托育: {}
      家政: {}

# --------------------------------------------------------------------------- #
# 裁决: 每条都写清「为什么」, 而不是只留一个结论
# --------------------------------------------------------------------------- #
decisions:
  - id: three_sets
    question: "三套品类口径 (国补 10 / 本体 9 / 地方券实测) 怎么合?"
    ruling: "定一张平表总枚举, 各场景做它的子集; 不强行合成一棵树。"
    because: >-
      三套之间没有从属关系: 地方的「餐饮/商超/汽车/教育/适老」在国补里压根不存在,
      国补的「手表/眼镜」在本体那 9 类里压根不存在, 而本体的「家电」是一个国补不敢用的粗类。
      强行合树必然要给「汽车」找一个上位类, 而那个上位类不对应任何政策参数 —— 只是为了好看。
    consequence: "「这个品类属于哪个档」的问题一律由场景子集回答, 总枚举只回答「它是不是一个合法品类」。"
    evidence:
      - "国补: agents/desktop/fact-cards/guobu-2026.yaml 的 categories (10 个键)"
      - "本体: 《Agent 组 → 本体组: 运行期事实供给契约》§6.1 的对照表"
      - "地方券: 本地宝合肥消费券专题页 48 条线索的实测品类分布"

  - id: computer_tier
    question: "「电脑」归家电还是数码?"
    ruling: "**归家电** (国补场景内): guobu 子集里 电脑.tier = 家电。总枚举只给「电脑」一个 id, 不给它任何档位。"
    because: >-
      这**不是命名洁癖, 是参数**: 国补家电是 15% + 单件上限 1500 + 必须 1 级能效,
      数码是 15% + 上限 500 + 结算价 ≤6000。同一台 8000 元的笔记本 (已跑过工具核过数):
      归家电算出 **1200** 元; 归数码则**直接超 6000 门槛算出 0** 元 —— 差整整 1200。
      而政策文件是把「电脑」列进家电以旧换新那一档的
      (资料卡 categories.电脑.tier = 家电, 出处 发改环资〔2025〕1745号 / 商办流通函〔2025〕469号),
      所以以文件为准, 不以「大家习惯把笔记本叫数码」为准。
    consequence: >-
      ① 任何「电脑是数码」的常识判断不得进入国补链路;
      ② 档位不进总枚举 —— 否则总枚举就得在「政策上归家电」和「常识上归数码」之间二选一,
      而它两个场景都要服务。这也是总枚举刻意做成平表的原因;
      ③ 若将来地方券出现「数码券」覆盖电脑, 那是**另一个场景子集里的一条数据**,
      改不到国补的档位 (场景之间不共享档位)。
    evidence:
      - "fact-cards/guobu-2026.yaml: categories.电脑.tier = 家电"
      - "fact-cards/guobu-2026.yaml: tiers.家电.cap = 1500 / energy_required = true, tiers.数码.cap = 500 / price_gate = 6000"
      - "tests/agents/desktop/test_subsidy_calc_golden.py: 第 7 条 结算价 1500 / 品类 笔记本 / 能效 2级 -> 报「家电需 1 级能效」, 即已上线的行为就是按家电判的"

  - id: coarse_home_appliance
    question: "「家电」这个粗类在国补场景里怎么办?"
    ruling: "保留为总枚举的一个 id (地方券确实按它发), 但**不进 guobu 子集**。"
    because: >-
      国补的 6 类家电各有各的参数边界, 「家电」落不到任何一类上。若把它折成 6 类里的某一类
      (比如默认空调), 就是**在没有证据的情况下替用户选了一个档**, 而那正是会算错钱的那种错。
    consequence: "guobu 侧收到「家电」必须追问具体是哪一件 (空调? 冰箱?), 追问比猜便宜得多。"
    evidence:
      - "地方券实测: 合肥 48 条线索里家电 1 条 —— 粗类确实被这么用"
      - "fact-cards/guobu-2026.yaml: 6 类家电的 category_label 都写着「家电以旧换新 (6 类之一)」, 没有「家电」这一档"

  - id: local_voucher_is_observed_not_exhaustive
    question: "地方券子集记的是「实测见到的」, 会不会被读成「存在的全集」?"
    ruling: "子集只记实测见到的; 没进子集**只说明没证据, 不说明不存在**。"
    because: >-
      这是 A2 一贯的纪律 (voucher_clues: 「抓不到绝不等于没有券」)。子集的用途是
      「用户说了这些词, 我知道它们是这个场景的品类」, 不是「用户说了别的词, 就没有券」。
    consequence: "新增品类 = 往子集加一条数据, 不改代码; 而「不在子集」不得用来回绝用户。"
    evidence:
      - "agents/desktop/tools/voucher_clues.py 的 note 与 reason=no_clues_found 的措辞"

  - id: ontology_only_ids
    question: "「教育」和「适老」既在本体那 9 类里, 也在总枚举里, 为什么不在任何场景子集里?"
    ruling: "留在总枚举, 不进 local_voucher 子集。全表就这两个是「合法但没场景认领」的。"
    because: >-
      进总枚举是因为本体文档明确列了它们 (口径得认得这两个词);
      不进地方券子集是因为本轮实测**没有**见到教育券与适老券 —— 进了就等于宣称它们有券源,
      那是没证据的断言。本包对「缺证据」的一贯处理是**不写**, 而不是写一个看起来更完整的名单
      (voucher_clues 的「抓不到绝不等于没有券」说的是同一个道理的另一面)。
    consequence: >-
      它们今天是「合法的品类, 但还没有场景认领」; 哪天真抓到教育券/适老券,
      往 local_voucher.categories 加一条即可, 不改代码。
    evidence:
      - "本体 §3.2 的 9 类含教育与适老"
      - "本轮实测的合肥 48 条 + 另见过的 8 类里都没有这两个"

  - id: category_hints_are_not_an_enum
    question: "voucher_clues 里那份 _CATEGORY_HINTS 算不算第四套枚举?"
    ruling: "不算。它是**标题关键词表**, 用来给「这个城市有什么类型的券」一个量感, 刻意不等于品类枚举。"
    because: >-
      它比枚举宽 (含 家居/超市/旅游/数码/手机/电动 这些能出现在标题里、但不是规范 id 的词),
      而它的输出 categories_seen 是**计数**不是判定。把它当枚举用会把两件事混起来:
      计数漏一个词只是少一个量感, 枚举漏一个 id 会让用户的话认不出来。
    consequence: "本文件不接管 _CATEGORY_HINTS; 需要它对齐时, 对齐的是**别名**, 不是把两张表合并。"
    evidence:
      - "agents/desktop/tools/voucher_clues.py 的 _CATEGORY_HINTS 与 _categories_seen"

  - id: matching_is_suffix_and_case_sensitive
    question: "别名怎么匹配? 大小写要不要归一?"
    ruling: >-
      沿用已上线那套: **完全相等或以别名结尾, 取最长命中** (所以「平板电脑」落到平板而不是电脑);
      大小写**不**归一 (所以 ipad 命中平板, iPad 不命中)。
    because: >-
      两套归一规则并存时, 同一个词的结果取决于谁先被调用 —— 那是最难查的一类不一致,
      比「少认一个词」贵得多。大小写不归一是这套规则**已知的代价**, 不是没看见:
      它已经记在 tests/agents/desktop/test_guobu_known_failures.py 的
      test_brand_names_normalize_to_a_category 里 (断言 iPad/iPhone/MacBook 应归一到品类, 今天 xfail)。
    consequence: >-
      要修就**在规则那一处修**: 换过运行时来源之后, 匹配规则只剩本模块一处
      (`_match_all` 给全表归一, `match_among` 给候选集归一), 但仍然是**两条路** ——
      只给其中一条加 casefold, 同一个词就会在「认得出这是什么品类」与「算不算国补」两条链路上
