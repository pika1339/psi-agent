      地方券的**粗类**。国补里没有这一个 id —— 国补必须落到上面 6 个具体类,
      因为能效门与单件上限按类不同。它与那 6 个不是父子关系 (总枚举是平表),
      由场景子集决定各自在哪边。国补侧遇到「家电」这个粗说法要**追问是哪一件**,
      不许折成 6 类里的任意一类: 猜错就按错的能效门与上限算钱。
  餐饮:
    display: "餐饮"
    kind: 服务
    aliases: ["餐饮", "餐厅", "吃饭", "美食", "外卖", "堂食"]
