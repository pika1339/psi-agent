# 品类枚举 —— A2 场景族的**总枚举**, 各场景是它的子集
#
# 为什么要有这张表: 同一个场景族里曾经跑着**三套互不兼容的品类口径** (见 decisions.three_sets):
#   1. 国补 (跑在代码里那套): 10 个 id —— 家电 6 (空调/冰箱/洗衣机/电视/热水器/电脑)
#      + 数码 4 (手机/平板/手表/眼镜);
#   2. 本体文档 §3.2: 9 类 (手机/电脑/平板/**家电**/餐饮/商超/汽车/教育/适老) —— 「家电」是粗类,
#      而国补必须把 6 类家电各自独立 (能效门、上限按类不同), 且它里面没有手表/眼镜;
#   3. 地方消费券实测见到的: 汽车/餐饮/加油/文旅/电影/百货/家电/商超/住宿/体育/图书/医药/养老/托育/家政。
# 三套之间没有从属关系, 于是「用户说家电」在国补链路上落空, 「用户说手表」在本体侧认不了。
#
# 本文件定的是**口径**, 不是某一套参数的副本:
#   categories  总枚举 —— 规范 id + 展示名 + 类别 (实物/服务) + 常见别名
#   scenarios   场景子集 —— 国补 (带档位归属) / 地方消费券 (只收实测见到的)
#   decisions   口径裁决与理由 —— 每条都写明为什么, 免得后来的人当成手滑改回去
#
# **总枚举刻意是平表, 没有父子树。**「电脑」在国补里归家电 (1 级能效 + 1500 上限),
# 在电商常识里是数码 (500 上限 + 6000 门槛), 两者参数完全不同。树只有一条父边, 会逼着
# 二选一; 所以归属交给场景子集 —— 见 decisions.computer_tier。这也正是
# 《Agent 组 → 本体组》§6.1 要的那张「统一商品品类总枚举 + 各场景子集」。
#
# 顺序: 先国补 10 个 (已上线的那套, 顺序与资料卡一致), 再其余。**顺序不参与判定**,
# 只影响「别名命中一样长时谁先被选中」这种边角 —— 判定以别名为准, 不以顺序为准。
#
# 类别 (实物/服务) 的分法 (全表按这**一条**规则判, 免得逐条各判各的):
#   实物 = 买到的是一件具体商品, 有型号/能效/单价, 能被国补那类「按件」的规则套上;
#   服务 = 按次/按单核销的一次消费, 没有型号与能效, 上限天然按次算, 套不上「按件」的规则。
# 它只是**分类标签**, 不是政策参数 —— 谁能不能吃国补由场景子集的档位定, 不由这里定。

version: 1
verified_at: "2026-09-18"

# --------------------------------------------------------------------------- #
# 总枚举: 规范 id -> 展示名 / 类别 / 别名
# --------------------------------------------------------------------------- #
#
# 规范 id 就是**工具之间传的那个值**: 国补那 10 个必须与
# fact-cards/guobu-2026.yaml 的 categories 键逐字相同 (否则资料卡查不到参数),
# 所以它们是「手表」「眼镜」而不是展示名「智能手表手环」「智能眼镜」——
# 展示名会随话术改, id 一改参数就查不到, 两件事必须分开。
# 由 tests/agents/desktop/test_category_enum.py 钉死。
