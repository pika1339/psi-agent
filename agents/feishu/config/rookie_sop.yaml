# 新人入职 SOP 清单(V4 新模板)—— 改这里不用改代码。
#
# 结构(相对 V3 的扩展, 保持向后兼容):
#   header:   文档头部静态区(欢迎词/说明/伙伴特质 3 条可勾选/完整 SOP 链接)
#   mentions: 文本里写 @名字 即渲染成飞书 mention(open_id 按海豚豚应用维度)
#   faq:      文档尾部问答区(纯静态, 不进明细表、不参与进度)
#   modules:  清单模块。每个模块可带 groups(文档里渲染成 H3 小组标题),
#             不带 groups 时与 V3 相同(条目直接跟在模块标题下)。
#
# 条目字段:
#   id/title/acceptance: 同 V3。acceptance 里可写 @名字(见 mentions)与
#      链接片段(见下方 links 说明)。
#   url:        填了 url 的是必读材料(链接 + 已完全理解/未完全理解 两个勾选)
#   got_it_note: 必读材料的「已完全理解」勾选后面追加的说明文字
#   dev_only:    true 表示仅研发适用(角色选择后生效)
#   window_days: 模块级(组内条目共享模块窗口); 也可单条覆盖
#   links:       [{text: 片段文字, url: 链接}] —— acceptance 里出现 text 片段时
#               渲染成超链接 run(如「南门师生活动中心」→ 高德地图链接)
#
# 模块字段:
#   checker: 验收人名字(渲染成「验收人@名字」, 在 mentions 里则 mention)

