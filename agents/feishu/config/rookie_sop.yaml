# 文档尾部问答区 —— 纯静态内容, 不进明细表、不占进度、不参与催办。
faq:
  - q: "1. 怎么正确理解组织与你的关系？"
    a:
      - "双向投资人：组织投的“ 平台、算力、机会、试错的空间、成长的路径。”"
      - "你投在组织的“ 把事做成的行动、对用户和业务真实的结果、你自己在变强。”"
      - "一荣俱荣，一损俱损。 组织越好，你的平台越大；你成长越快，组织越强。我们不是互相消耗，是互相成为对方成长的杠杆。"
  - {q: "2. 组织纪律性：工作进展、工作成果需要什么？", a: "及时汇报与同步：先说结论、不记流水账——日会、TODO（周一三五 15:00 前）、周六周会都是同步场合。"}
  - {q: "3. 我不好意思打扰小组长，怎么办？", a: "小组长的职责就是帮你复盘、给你反馈；主动找 ta 是被鼓励的行为，ta 不会嫌烦。你不来找，ta 反而会担心你卡住了。"}
  - q: "4. 被领导批评了，怎么办？"
    a:
      - "对事不对人：批评针对的是事情，不是否定你这个人。不要玻璃心。"
      - "赶紧--**工作复盘--**~~核心原则：先认事实、不辩解，再找根因、落地改进，主动对齐组长获取建议，最后确认预防机制，不是单纯认错，重点是闭环，杜绝重复犯错。~~"
  - q: "5. 什么叫“没有对齐”？"
    a:
      - "接任务当场确认三件事：做什么、什么标准、什么时候交；过程中有风险立即上报；交付前再核对一次——不一致或理解不一样那就是“没对齐”。"
      - "##面临unknown unknowns怎么办？##"
      - "给你一个方法：应该怎么问自己 ？   “这块我从没做过，我不确定还有什么没看到——能不能找做过的人对 30 分钟？”"
  - {q: "7. 任务做不完了，什么时候说？", a: "越早越好：遇到困难当场求助，有风险立即上报；deadline 前才说做不完是大忌。"}
  - {q: "8. 遇到问题不知道问谁？", a: "默认找小组长。"}
  - {q: "9. 公司制度哪里查？", a: "先问 Haitun，80% 的问题它秒答；它不知道的，会告诉你找谁。"}
  - {q: "10. 动手前应该先问自己什么？", a: "这对我服务的用户有什么价值？（用户第一）"}
  - {q: "11. 遇到风险或要延期，怎么办？", a: "提前说，不捂到最后。"}
  - {q: "12. 手头活干完了，接下来干什么？", a: "主动问下一个任务，不等人催。"}
  - q: "13. 飞书消息要怎么回？"
    a: "尽快回复，信息务必实事求是，越重要的信息务必核实，尽量简明扼要的同时包含足够上下文，尽量分清场合分清对象针对性汇报。（来源：真知信息沟通SOP）"
    links:
      - {text: 真知信息沟通SOP, url: "https://genuineknowledge.feishu.cn/wiki/D3T9wdEQ1iRQsFkZO2ocwNZpnng"}
  - {q: "14. 遇到问题先找谁？", a: "先问 Haitun，再问人。"}
  - q: "15. 工资什么时候发？怎么考核？"
    a: "每月 15 日发上月薪资；按 7:3 考核，系数 S/A/B/C/F。（来源：新人入职 SOP · 试运行）"
    links:
      - {text: 新人入职 SOP · 试运行, url: "https://genuineknowledge.feishu.cn/docx/BFs4dmCxkohnMVxP47vc7Exonxf"}
  - q: "16. 正负面行为清单是什么？"
    a: "一套陪你变好、变靠谱的自检与成长机制：记录你的成长值；负面清单是为了纠偏，同样是成长值；如果正负面清单无记录，你需要提高警惕了。（来源：正负面清单 SOP · 试运行）"
    links:
      - {text: 正负面清单 SOP · 试运行, url: "https://genuineknowledge.feishu.cn/wiki/MyUywH7bQiVncgkuYJLcBZjungc"}
  - {q: "17. 怎么算「留下了」？", a: "2 周到 2 个月观察靠谱与向心力，通过后进战役大群；正负面清单是抓手。"}
  - {q: "18. 入职登记要交什么？", a: "学历学位证书/学号、工作经历、家庭情况、体检报告；未如约上传的，一个月内补交。"}
  - {q: "19. 如何融入集体？", a: "主动伸出手，别等别人来找你：日会周会认真听、也说说自己的进展；看到同事卡住主动帮一把；学习期周六主动出勤；愿意分享自己的成长与踩过的坑——融入不是被接纳，是你先成为其中的一员。"}
  - {q: "20. API 怎么报销？", a: "在飞书提交报销审批，附上发票；报销金额要与实际消耗金额一致。"}

modules:
  # ── 模块一：靠谱之执行(7 个小组) ──────────────────────────
  - name: 靠谱之执行
    emoji: 🏃
    checker: 罗霖
    window_days: 7
    groups:
      - name: 到岗准备
        emoji: 🏢
        items:
          - id: wifi
            title: 连上 WiFi
            acceptance: 404/412  KCL_in_GX / 密码：USTCKCL8-GX；能上网即可
          - id: campus_card
            title: 领取校园卡
            acceptance: 身份证+手机号+姓名发@陈芃泽，带身份证到南门师生活动中心 107 领校园卡；能进校和食堂用餐
            links:
              - {text: 南门师生活动中心, url: "https://ditu.amap.com/ssr/place/B0I2LUE7EX?id=B0I2LUE7EX&source=map&name=%E4%B8%AD%E5%9B%BD%E7%A7%91%E5%AD%A6%E6%8A%80%E6%9C%AF%E5%A4%A7%E5%AD%A6%E9%AB%98%E6%96%B0%E6%A0%A1%E5%8C%BA%E5%B8%88%E7%94%9F%E6%B4%BB%E5%8A%A8%E4%B8%AD%E5%BF%83"}
          - id: desk
            title: 确认工位与开门方式
            acceptance: 对接人@罗霖，知道「我的座位在哪」，实验室 A404 / A412
      - name: 搞清楚谁是谁
        emoji: 🤝
        items:
          - id: know_leader
            title: 确认小组长
            acceptance: 派活的人，打你 70% 成果分；管你成长，打你 30% 价值观分；入职后会主动来找你
          - id: know_managers
            title: 知道管理负责人是@周熠@张浩
            acceptance: 决定谁留谁走
          - id: know_functions
            title: 记住三个赋能组对接人
            acceptance: 人事找@罗霖、钱和社保找@郑伟丽、门禁合同找@陈芃泽
          - id: task_intake
            title: 接任务当场确认三件事
            acceptance: 做什么、什么标准、什么时候交；困难求助、风险立即上报
      - name: 登录账号
        emoji: 🔑
        items:
          - id: login_feishu
            title: 登录飞书
            acceptance: 能登录并看到团队群
          - id: login_todo
            title: 登录 TODO
            acceptance: 能打开 TODO 库并能编辑
      - name: 考勤与请假
        emoji: 🕐
        items:
          - id: attendance
            title: 考勤规则
            acceptance: 每天两次卡（上班 9:00 / 下班 19:00，午休 12:00-14:00）；每周 2 次免审批补卡；异常 3 个工作日内申诉；晚 21:00 后离开，次日 10:00 前到岗不计迟到。来源：新人入职 SOP · 试运行
            links:
              - {text: 新人入职 SOP · 试运行, url: "https://genuineknowledge.feishu.cn/docx/BFs4dmCxkohnMVxP47vc7Exonxf"}
          - id: leave
            title: 请假
            acceptance: 走飞书「假勤」提交审批，审批通过才生效；口头请假无效
      - name: 会议与节奏
        emoji: 📅
        items:
          - id: weekly_rhythm
            title: 记住每周节奏
            acceptance: 周一三五上午参加每日对齐会；周一三五 15:00 前更新 TODO；周六 15:00 线下周会 A450
          - id: meeting_number
            title: 存好日会会议号
            acceptance: agent 日会 10:00-10:45（571-5278-7045）；入口日会 10:45-11:15（485-2417-7690）；本体日会 11:15-12:00（426-5469-9903）；详情见日历
      - name: 签署与红线
        emoji: ✍️
        items:
          - id: sign_documents
            title: 签完入职文件
            acceptance: 信息登记表、协议/合同、保密协议、制度知悉确认书、两份签收页
          - id: redlines
            title: 七类红线
            acceptance: 触碰了不是你不够好，是真知这条路不适合你，这次的合作关系只能到这里了。来源：新人入职 SOP · 试运行
            links:
              - {text: 新人入职 SOP · 试运行, url: "https://genuineknowledge.feishu.cn/docx/BFs4dmCxkohnMVxP47vc7Exonxf"}
      - name: 工资与假期
        emoji: 💰
        items:
          - id: payroll
            title: 工资
            acceptance: 每月 15 日发上月薪资，见飞书工资单
          - id: annual_leave
            title: 年假
            acceptance: 按劳动法规定

  # ── 模块二：靠谱之认真领会贯彻执行 ──────────────────────
  - name: 靠谱之认真领会贯彻执行
    emoji: 📖
    checker: 罗霖
    window_days: 7
    items:
      - {id: mission, title: 真知使命, acceptance: 让 AI 为用户按需赋能}
      - {id: vision, title: 真知愿景, acceptance: 符号与连接融合引领 ASI（Artificial Super Intelligence）}
      - {id: goal, title: 真知目标（当下）, acceptance: 做最牛的 Agent（LOM + LLM + Harness）}
      - {id: culture_sop, title: 真知企业文化总则（简版）SOP, url: https://genuineknowledge.feishu.cn/wiki/JyCLwr60lineYBkkJmQcZf0PnTb}

  # ── 模块三：7:3 原则释义 ──────────────────────────────────
  - name: 7:3 原则释义
    emoji: ⚖️
    checker: 罗霖
    window_days: 7
    items:
      - {id: only_standard, title: 唯一考核标准, acceptance: 每个考核周期按 100% 计，全部角色适用同一套标准，无豁免}
      - {id: score_70, title: 70% 考核「外部客观成果」, acceptance: 所有的工作跟六类外部客观成果都应该有直接或间接关联，载体是 TODO}
      - {id: score_30, title: 30% 考核「价值观与行动力」, acceptance: 即“怎么交付的”，以正负面清单记录的行为事实为依据，记录的都是成长值，两周内无任何记录的需重点关注并分析}
      - {id: no_exemption, title: 全部角色适用同一套标准, acceptance: 无豁免}
      - {id: talent_sop, title: 真知人才选拔、考核与晋升标准总则 SOP, url: https://genuineknowledge.feishu.cn/wiki/FqBiwivDEiZSAnkaHoXc3JvHnHf}

  # ── 模块四：TODO 闭环(7 分) ────────────────────────────────
  # flowchart: true 表示文档里在条目后插一张流程图图片(见 rookie_sop_card_send 的
  # flowchart_image 参数; 图由 drawio/matplotlib 生成, 飞书 API 画不了真流程图)
  - name: TODO 闭环（70% 外部客观成果）
    emoji: 📝
    checker: 小组长
    window_days: 7
    flowchart: true
    items:
      - id: todo_spec
        title: TODO list 规范与填写范例
        url: https://genuineknowledge.feishu.cn/wiki/KkJ8wstIZiD3Uck87PPcWgDdnmb
        got_it_note: 会写合格的 TODO —— 大目标(3-6 月)→ 小目标(1 周-1 月)→ TODO(1-3 天)，层层拆解、每级写标准；写「什么时间干成满足什么标准的事」

  # ── 模块五：正负面清单闭环(3 分) ──────────────────────────
  - name: 正负面清单闭环（30% 价值观与行动力）
    emoji: 🔁
    checker: 罗霖
    window_days: 7
    items:
      - id: pn_fair
        title: 公开 · 公平 · 全面
        acceptance: 正负面清单的三个原则。来源：正负面清单 SOP · 试运行
        links:
          - {text: 正负面清单 SOP · 试运行, url: "https://genuineknowledge.feishu.cn/wiki/MyUywH7bQiVncgkuYJLcBZjungc"}
      - id: pn_none
        title: 无正负面清单记录
        acceptance: 什么都不做、不暴露问题才是最糟的；同一负面清单不重复犯（有 3 次机会）
      - id: pn_facts
        title: 记录客观事实
        acceptance: 写「时间 + 谁 + 在什么事上 + 怎么做的」，不写“很优秀、很积极”这类很主观的话
      - id: pn_review
        title: 工作复盘
        acceptance: 核心原则：先认事实、不辩解，再找根因、落地改进，主动对齐组长获取建议，最后确认预防机制，不是单纯认错，重点是闭环，杜绝重复犯错

  # ── 模块六：公司现行 SOP ──────────────────────────────────
  - name: 公司现行 SOP
    emoji: 📚
    checker: 罗霖
    window_days: 7
    items:
      - id: smart_sop
        title: 真知智能SOP
        url: https://genuineknowledge.feishu.cn/wiki/UYQpwjkUVin4wjkJTnPcKnOUnZb

  # ── 模块七：开发人员请你这么干(研发专属) ──────────────────
  - name: 开发人员请你这么干
    emoji: 💻
    checker: 张浩
    window_days: 7
    items:
      - id: role_confirmed
        title: 确认是否为技术人员
        acceptance: 点一下即可，非研发无需完成下面几项
      - id: dev_spec
        title: 真知开发规范 SOP
        url: https://genuineknowledge.feishu.cn/wiki/LXNYwmxaYiNcYDk9SHLc3xLEnAb
        dev_only: true
      - id: read_agents_md
        title: 读项目的 AGENTS.md
        acceptance: 用 code agent 读；链接问小组负责人要
        dev_only: true
      - id: code_graph
        title: 点击看项目的框架
        acceptance: 先看代码图谱了解整体结构,再深入代码(链接问小组负责人要)
        links:
          - {text: 看项目的框架, url: "http://47.100.84.197/code-graph/"}
        dev_only: true
      - id: setup_dev_env
        title: 配好开发环境
        acceptance: clone 代码能跑起来
        dev_only: true
      - id: pr_workflow
        title: 知道怎么提 PR、谁 Code Review
        acceptance: 说得出流程与 reviewer
        dev_only: true
      - id: repo_access
        title: 开通仓库权限
        acceptance: 找小组负责人开通，能 push 代码
        dev_only: true
