# 正负面清单 · 关系认知（认知口径本体）—— 供 skill 与 tool 读取引用, 不写进代码。
#
# 出处: 正负面清单执行方案 · 之关系认知（08-22 全员会, HR 主持, 适用全体员工含实习生）。
# 本文件回答的是"清单到底是什么、正负面该怎么读、报告该怎么写";
# "哪条行为算哪一档"是 6.0-shadow.yaml 的职责, 两者不互相代替。
#
# 改认知口径只改本文件 —— SKILL.md 只留要点并指到这里, 工具经
# ``positive_negative_rules`` 的 ``cognition`` 字段（含 ``cognition_source`` 指纹）
# 与 ``positive_negative_case_analyze`` 的 ``认知口径`` 字段取值。代码里不得另写一份。

version: "1.0"
status: active

source_document:
  name: 正负面清单执行方案 · 之关系认知
  url: https://genuineknowledge.feishu.cn/docx/Shc6dwJGgoFSIkxv4mHcqnUnnnh
  occasion: 08-22 全员会（HR 主持）
  audience: 全体员工（含实习生）

premise: 清单不是公司拿来约束你的工具，是组织兑现"你的投入会被看见"的承诺书。
order: 关系是根，清单是枝叶 —— 先懂关系，再懂清单。

relationship:
  frame: 共同投资人关系（双向投资）
  roles:
    组织: 投资人
    员工: 创业者
  organization_invests: [平台, 算力, 机会, 试错空间, 成长路径]
  member_invests: [行动, 产出, 个人成长]
  mutuality: 组织给你本金，你还组织利息；不是互相消耗，是互相成为对方成长的杠杆。

# 认知标准本体: 每条方向"翻译了什么行为、组织怎么回应、为什么这也算成长"。
reading:
  positive:
    label: 正向清单
    translates: 什么样的行为可以把事做对，说明你在履行"创业者"身份
    organizational_response: 值得被看见、被激励
    growth: 记的是成长：做对了什么、怎么做到的，下一轮可以复制。
  negative:
    label: 负面清单
    translates: 什么样的行为在破坏"共同投资人"的信任基础
    organizational_response: 需要被纠正
    growth: 同样是成长：拿到清晰边界和改正路径，纠偏记的也是成长值。
  red_line:
    label: 红线
    translates: 什么样的行为让信任彻底破裂
    organizational_response: 关系终止
    growth: 红线不是成长记录，是人工处理通道，不由 Agent 认定。

# 三个心里的坎, 一次说清 —— 报告与对话都不得把它们讲反。
stance:
  - question: 这是不是公司在监控我
    answer: 不是。第一原则是"被看见先于被记录"：先感受到肯定和支持，台账是背后的回报机制；机制本身可以被讨论、修改，监控是单向的，机制是双向的。
  - question: 是不是又要扣我钱
    answer: 不是。30 分价值观与行动力考核是季度综合评估的一部分；负面行为有递进处置，设计初衷是给改进机会，不是一上来就罚。
  - question: 这跟我有什么关系
    answer: 关系很大：做好了被看见，做错了有清晰边界和改正路径；不用猜"领导怎么看我"，事实会说话。

# 台账纪律: 记什么、不记什么。
ledger_discipline:
  - 只认事实，不认印象：只记 发生时间 + 客观事实 + 造成影响。
  - 禁止"态度差""不积极"这类主观评语。
  - 对事不对人，不贴标签：依据是事实，不是某个人对你的印象。
  - 宁可漏记，不误判：拿不准的进待定清单。
  - 这是我们一起定的公约，不是公司压下来的：CEO 和管理层同样受约束，没有例外。

# 报告/汇总口径: 正负面清单的报告按这套写。
report_rules:
  - 正面与负面都是同一个人的成长记录，按成长线放在一起呈现。
  - 不得写成"表扬 vs 批评"，也不得写成"加分 vs 扣分"。
  - 负面记录必须同时给出正确做法、立即补救和防再犯，让读者看到改正路径。
  - 先讲这一期做对了什么、哪里需要纠偏，再给条数与分布；条数是事实，不是评价。
  - 不排名、不比分、不出绩效结论，不向无关成员披露某个人的记录。
  - 红线只写"可能需要人工处理"，不写红线已经成立。

# 汇总/报告尾部固定披露, 工具直接取用。
disclosure: 本分析仅用于理解记录和后续沟通，不产生分数、排名或绩效结论。

# 员工侧记录通知卡的说辞。卡片由代码确定性渲染, 拿不到工具返回的认知口径, 所以这两句必须
# 住在这里 —— 负面卡只有"正确做法/立即补救/预防措施"三条而没有成长框架时, 员工收到的
# 读起来就是一张罚单, 而那正是本次要修的认知偏差。
notice:
  positive: 这条记录同样是成长记录：它把可复用的工作方式沉淀下来，感谢你的实践和贡献。
  negative: 这条记录同样是成长记录：拿到了清晰边界和改正路径，纠偏记的也是成长值。
